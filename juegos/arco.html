:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#12261a; --panel:rgba(18,38,26,.90); --panel2:rgba(255,255,255,.10);
  --text:#f7f1e1; --muted:#b9c7a8; --gold:#f2b632; --gold-ink:#2b1c00;
  --wood:#6b3f1d; --red:#e5333d; --green:#4cc37a; --line:rgba(247,241,225,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d1c13; --panel:rgba(13,28,19,.92); --panel2:rgba(255,255,255,.09); --text:#f7f1e1; --muted:#a9b898; }
}
:root[data-theme="dark"]{ --bg:#0d1c13; --panel:rgba(13,28,19,.92); --panel2:rgba(255,255,255,.09); --text:#f7f1e1; --muted:#a9b898; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;}
body{height:100%;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--text);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
#app{position:relative;width:100%;height:100%;overflow:hidden;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none;}
#hud.on{display:block;}
#topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap;}
#hScore{color:var(--gold);}
#topbar .sp{flex:1;}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;font-weight:800;}
#hist{position:absolute;top:58px;left:0;right:0;text-align:center;font-weight:800;font-size:15px;color:var(--gold);text-shadow:0 1px 3px #000;}
#distTag{position:absolute;top:92px;left:10px;}
#windbox{position:absolute;top:92px;right:10px;display:flex;align-items:center;gap:8px;}
#windArrow{display:inline-block;font-size:20px;color:var(--gold);transition:transform .3s;}
#cross{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border:2px solid rgba(255,255,255,.85);border-radius:50%;
  background:linear-gradient(#fff,#fff) center/2px 22px no-repeat,linear-gradient(#fff,#fff) center/22px 2px no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.35);will-change:transform;}
#aid{display:none!important;
  box-shadow:0 0 0 2px #fff,0 0 8px #000;background:rgba(229,51,61,.25);will-change:transform;}
#power{position:absolute;left:50%;bottom:112px;width:170px;height:10px;margin-left:-85px;border-radius:9px;background:rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden;}
#powerFill{height:100%;width:0;background:linear-gradient(90deg,#4cc37a,#f2b632);}
#powerFill.full{background:var(--gold);}
#hint{position:absolute;left:16px;right:16px;bottom:140px;text-align:center;font-size:15px;line-height:1.4;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:420px;margin:0 auto;}
#popup{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0;text-shadow:0 3px 10px rgba(0,0,0,.7);}
#popup b{display:block;font-family:'Bungee',Impact,sans-serif;font-size:76px;line-height:1;font-weight:400;}
#popup span{display:block;font-size:20px;font-weight:800;margin-top:4px;}
#popup.show{animation:pop 1.4s ease-out forwards;}
#popup.rw b{color:#f4f4f0;-webkit-text-stroke:2px #555;}
#popup.rk b{color:#222;-webkit-text-stroke:2px #fff;}
#popup.rb b{color:#2a7de1;-webkit-text-stroke:2px #fff;}
#popup.rr b{color:#e5333d;-webkit-text-stroke:2px #fff;}
#popup.ry b{color:#ffd21f;-webkit-text-stroke:2px #7a4d00;}
#popup.bad b{color:#9aa1ab;-webkit-text-stroke:2px #222;}
.chip{display:inline-block;min-width:26px;height:26px;line-height:22px;border-radius:13px;margin:0 3px;font-size:13px;font-weight:800;text-align:center;border:2px solid rgba(255,255,255,.85);box-sizing:border-box;text-shadow:none;padding:0 4px;}
.chip.rw{background:#f4f4f0;color:#222;} .chip.rk{background:#222;color:#fff;} .chip.rb{background:#2a7de1;color:#fff;}
.chip.rr{background:#e5333d;color:#fff;} .chip.ry{background:#ffd21f;color:#3a2700;} .chip.bad{background:#555;color:#fff;}
#legend{position:absolute;left:12px;bottom:26px;display:flex;flex-direction:column;gap:4px;align-items:stretch;}
#legend .chip{margin:0;min-width:50px;}
.chips{text-align:center;max-width:340px;line-height:34px;}
@keyframes pop{0%{opacity:0;transform:scale(.5)}14%{opacity:1;transform:scale(1.15)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#btnBreath{pointer-events:auto;position:absolute;right:16px;bottom:22px;width:78px;height:78px;border-radius:50%;border:2px solid var(--line);
  --p:100%;background:linear-gradient(to top,rgba(242,182,50,.75) var(--p),var(--panel) var(--p));font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
#btnBreath.hold{border-color:var(--gold);}
#btnBreath big{font-size:22px;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}

#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.72) 100%);}
#hScore.bump{animation:bump .35s ease-out;}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
/* Pantallas */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:18px;overflow:auto;
  background:radial-gradient(ellipse at 50% 35%,rgba(18,38,26,.35),rgba(6,14,9,.82));touch-action:pan-y;}
.screen.show{display:flex;}
.logo{font-family:'Bungee',Impact,sans-serif;font-size:clamp(40px,11vw,74px);line-height:.95;text-align:center;color:var(--gold);text-shadow:0 4px 0 var(--wood),0 8px 18px rgba(0,0,0,.6);}
.sub{color:var(--text);font-size:16px;text-align:center;max-width:320px;}
.coins{font-weight:800;font-size:18px;background:var(--panel);border:1px solid var(--line);padding:6px 16px;border-radius:999px;}
.btn{border:0;border-radius:14px;padding:14px 26px;font-weight:800;font-size:18px;background:var(--gold);color:var(--gold-ink);min-width:220px;box-shadow:0 4px 0 #a9761a;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a9761a;}
.btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.4);}
.btn.small{min-width:0;padding:10px 18px;font-size:16px;}
.btn[disabled]{opacity:.45;box-shadow:none;}
h2{margin:0;font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:28px;color:var(--gold);text-align:center;}
#lvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:400px;}
.lv{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:800;gap:2px;}
.lv span{font-size:13px;color:var(--gold);letter-spacing:1px;}
.lv.lock{opacity:.4;}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.up{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;}
.up:last-child{border-bottom:0;padding-bottom:0;}
.up .t{flex:1;} .up .t b{display:block;font-size:17px;} .up .t small{color:var(--muted);font-size:13px;line-height:1.3;display:block;}
.pips{display:flex;gap:4px;margin-top:5px;} .pips i{width:16px;height:7px;border-radius:4px;background:var(--panel2);} .pips i.on{background:var(--gold);}
.stars{font-size:44px;color:var(--gold);letter-spacing:6px;text-shadow:0 3px 8px rgba(0,0,0,.6);}
.big{font-size:20px;font-weight:800;text-align:center;}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
#sMenu{gap:9px} #sMenu .btn{padding:11px 22px;font-size:17px}
.screen>:first-child{margin-top:auto} .screen>:last-child{margin-bottom:auto}
.ms{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ms:last-child{border-bottom:0;padding-bottom:0}
.ms .t{flex:1} .ms .t b{display:block;font-size:16px;line-height:1.25}
.bar{height:8px;border-radius:5px;background:var(--panel2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4cc37a,#f2b632)}
.bar-txt{font-size:12px;color:var(--muted);margin-top:3px}
.icon-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:2px 0}
.corner-btn{position:relative;width:52px;height:52px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;color:var(--gold);gap:1px;cursor:pointer}
.corner-btn .cl{font-size:10px;color:var(--muted);font-weight:700;line-height:1}
.corner-btn .dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none}
.corner-btn.ready .dot{display:block}
.coins-row{display:flex;align-items:center;gap:10px;justify-content:center}
.shop-pill{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;cursor:pointer}
#toast{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 108px);text-align:center;pointer-events:none;opacity:0}
#toast span{display:inline-block;background:var(--panel);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;max-width:90%}
#toast.show{animation:toast 2.6s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#popup.show{animation-duration:.01s;}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="vignette"></div>
    <div id="topbar">
      <div class="pill" id="hLevel">Nivel 1</div>
      <div class="pill" id="hScore">0 pts</div>
      <div class="pill" id="hArrows">🏹 6</div>
      <div class="sp"></div>
      <button class="iconbtn" id="btnPause" aria-label="Pausa">❚❚</button>
    </div>
    <div id="hist"></div>
    <div id="legend"><span class="chip ry">9-10</span><span class="chip rr">7-8</span><span class="chip rb">5-6</span><span class="chip rk">3-4</span><span class="chip rw">1-2</span></div>
    <div class="pill" id="distTag">20 m</div>
    <div class="pill" id="windbox"><span id="windArrow">➤</span><span id="windTxt">0.0 m/s</span></div>
    <div id="cross"></div>
    <div id="aid"></div>
    <div id="power"><div id="powerFill"></div></div>
    <div id="hint"></div>
    <div id="popup"><b id="pScore"></b><span id="pTxt"></span></div>
    <button id="btnBreath"><big>🫁</big>Aguantar</button>
  </div>
  <div id="fade"></div>
  <div id="toast"><span id="toastTxt"></span></div>

  <div class="screen show" id="sSplash">
    <div class="logo">MAESTRO<br>DEL ARCO</div>
    <div class="sub">Tensa, apunta y suelta. Cuenta con el viento y la caída de la flecha.</div>
    <button class="btn" id="bStart">▶ Jugar</button>
  </div>

  <div class="screen" id="sMenu">
    <div class="icon-row">
      <button class="corner-btn" id="bMis"><span class="ci">📋</span><span class="cl">Misiones</span><span class="dot"></span></button>
      <button class="corner-btn" id="bTime"><span class="ci">⏱</span><span class="cl">0</span></button>
      <button class="corner-btn" id="bSurv"><span class="ci">❤</span><span class="cl">0</span></button>
      <button class="corner-btn" id="bSound"><span class="ci">🔊</span><span class="cl">Sonido</span></button>
    </div>
    <div class="coins-row">
      <div class="coins">🪙 <span id="mCoins">0</span></div>
      <button class="shop-pill" id="bShop">🛒 Tienda</button>
    </div>
    <button class="btn" id="bPlay">Campaña</button>
  </div>

  <div class="screen" id="sLevels">
    <h2>Elige un nivel</h2>
    <div id="lvGrid"></div>
    <button class="btn alt small" id="bLvBack">Volver</button>
  </div>

  <div class="screen" id="sMis">
    <h2>Misiones diarias</h2>
    <div class="coins">🪙 <span id="misCoins">0</span></div>
    <div class="card" id="misList"></div>
    <div class="sub" id="misInfo"></div>
    <button class="btn alt small" id="bMisBack">Volver</button>
  </div>

  <div class="screen" id="sShop">
    <h2>Tienda</h2>
    <div class="coins">🪙 <span id="sCoins">0</span></div>
    <div class="row" id="shopTabs"><button class="btn small" data-t="up">Mejoras</button><button class="btn small alt" data-t="bow">Arcos</button><button class="btn small alt" data-t="arr">Flechas</button></div>
    <div class="card" id="shopList"></div>
    <button class="btn alt small" id="bShopBack">Volver</button>
  </div>

  <div class="screen" id="sPause">
    <h2>Pausa</h2>
    <button class="btn" id="bResume">Continuar</button>
    <button class="btn alt" id="bRetryP">Reiniciar nivel</button>
    <button class="btn alt" id="bChase">Cámara de flecha: sí</button>
    <button class="btn alt" id="bSens">Sensibilidad: 1.0x</button>
    <button class="btn alt" id="bSoundP">Sonido: sí</button>
    <button class="btn alt" id="bMenuP">Salir al menú</button>
  </div>

  <div class="screen" id="sResult">
    <h2 id="rTitle">Nivel superado</h2>
    <div class="stars" id="rStars">★★★</div>
    <div class="big" id="rScore">0 puntos</div>
    <div class="chips" id="rChips"></div>
    <div class="sub" id="rInfo"></div>
    <div class="row">
      <button class="btn" id="bNext">Siguiente nivel</button>
      <button class="btn alt" id="bRetry">Reintentar</button>
      <button class="btn alt" id="bLevels">Niveles</button>
    </div>
  </div>
</div>

<script>
(function(){

const GRAV=4.0, CAMY=1.6, TH=1.6, BACK_Z=-117;

/* ---------- Guardado ---------- */

let save={coins:0,stars:{},up:{pow:0,stab:0,aid:0},sound:true,chase:true,tut:false,best:{time:0,surv:0},sens:1,daily:null,own:{bow:['prac'],arr:['std']},eq:{bow:'prac',arr:'std'}};

/* ---------- Misiones diarias ---------- */
const MPOOL=[
  {id:'shots',t:20,r:40,txt:'Dispara 20 flechas'},

];
const MBONUS=100;
const mDef=id=>MPOOL.find(x=>x.id===id);
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function ensureDaily(){
  const k=todayKey(); if(save.daily&&save.daily.date===k&&Array.isArray(save.daily.ms))return;
  let h=0; for(let i=0;i<k.length;i++)h=(Math.imul(h,31)+k.charCodeAt(i))>>>0;
  const pool=MPOOL.slice(), pick=[];
  while(pick.length<3){h=(Math.imul(h,1664525)+1013904223)>>>0; pick.push(pool.splice(h%pool.length,1)[0]);}
  save.daily={date:k,ms:pick.map(m=>({id:m.id,p:0,c:false})),bonus:false}; persist();
}
function toast(t){
  const e=$('toast'); $('toastTxt').textContent=t; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
  tone(660,.15,'triangle',.12); tone(990,.2,'triangle',.12,0,.1);
}
function mission(id,v,isMax){
  ensureDaily(); const m=save.daily.ms.find(x=>x.id===id); if(!m||m.c)return;
  const d=mDef(id); if(m.p>=d.t)return;
  m.p=Math.min(d.t,isMax?Math.max(m.p,v):m.p+v); persist();
  if(m.p>=d.t)toast('✔ Misión completada: '+d.txt);
}
function renderMissions(){
  ensureDaily(); const box=$('misList'); box.innerHTML='';
  save.daily.ms.forEach(m=>{
    const d=mDef(m.id), done=m.p>=d.t;
    const row=document.createElement('div'); row.className='ms';
    row.innerHTML=`<div class="t"><b>${d.txt}</b><div class="bar"><i style="width:${Math.round(m.p/d.t*100)}%"></i></div><div class="bar-txt">${m.p} / ${d.t}</div></div>`;
    const b=document.createElement('button'); b.className='btn small'; b.style.minWidth='104px';
    b.textContent=m.c?'✔ Reclamada':done?'Reclamar 🪙 '+d.r:'🪙 '+d.r; b.disabled=!done||m.c;
    b.addEventListener('click',()=>{
      ac(); if(m.c||m.p<d.t)return; m.c=true; save.coins+=d.r;
      if(save.daily.ms.every(x=>x.c)&&!save.daily.bonus){save.daily.bonus=true;save.coins+=MBONUS;}
      persist(); tone(660,.2,'triangle',.15); tone(990,.25,'triangle',.15,0,.1); renderMissions(); refreshLabels();
    });
    row.appendChild(b); box.appendChild(row);
  });
  const n=new Date(), ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;
  $('misInfo').textContent=(save.daily.bonus?'¡Bonus de +'+MBONUS+' monedas cobrado! ':'Completa las 3 y gana +'+MBONUS+' monedas extra. ')+'Se renuevan en '+Math.floor(ms/3600000)+' h '+Math.floor(ms%3600000/60000)+' min.';
  $('misCoins').textContent=save.coins;
}

for(let i=1;i<=20;i++){
  LEVELS.push({

const STAR_PTS=[30,40,50];
const WEAPONS=[
  {id:'prac',name:'Arco de práctica',cost:0,spd:1,draw:1.05,sway:1,wood:0x8a5a2b,tip:0xf2b632,grip:0x24170c,bh:.42,desc:'El arco de siempre: equilibrado.'},
  {id:'recu',name:'Recurvo de cazador',cost:400,spd:1.10,draw:1.0,sway:.95,wood:0xa0402a,tip:0xffd21f,grip:0x2a1408,bh:.42,desc:'Más veloz y un poco más estable.'},
  {id:'largo',name:'Arco largo',cost:800,spd:1.22,draw:1.3,sway:1.1,wood:0x5a3a1c,tip:0xe8d8b0,grip:0x1a1008,bh:.48,desc:'Muy potente para tiros lejanos, pero tarda en tensarse y tiembla más.'},

  {id:'elfo',name:'Arco élfico',cost:2400,spd:1.3,draw:.8,sway:.6,wood:0xe9dcae,tip:0x7dffb2,grip:0x2c5a3a,bh:.5,desc:'El mejor: veloz, firme y ligero.'}

const mShaft=new THREE.MeshLambertMaterial({color:0xe8d8b0});
const mTip=new THREE.MeshLambertMaterial({color:0x555555,side:THREE.DoubleSide});
const mFletch=new THREE.MeshLambertMaterial({color:0xd83a3a,side:THREE.DoubleSide});
function buildBroadhead(){
  // eje z: el 0 queda cerca de la PUNTA (frente de la flecha); más negativo = hacia atrás, hacia el astil
  const zTip=-.006, zBarb=-.045, zWaist=-.065, zBack=-.095, wBarb=.026, rBack=.009;
  // perfil de una aspa: punta -> barba (más ancha) -> cintura (se mete hacia adentro) -> base (radio del astil)
  const prof=[[0,zTip],[wBarb,zBarb],[wBarb*0.32,zWaist],[rBack,zBack]];
  const pos=[],idx=[];
  function blade(rot){
    const base=pos.length/3, c=Math.cos(rot), s2=Math.sin(rot);
    prof.forEach(([w,z])=>pos.push(w*c,w*s2,z));      // borde +
    prof.forEach(([w,z])=>pos.push(-w*c,-w*s2,z));     // borde - (misma recta, aspa plana)
    for(let i=0;i<3;i++){idx.push(base+i,base+4+i,base+i+1); idx.push(base+i+1,base+4+i,base+5+i);}
  }
  blade(0); blade(Math.PI/2);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  geo.setIndex(idx); geo.computeVertexNormals(); geo.userData.shared=true;
  return geo;
}

function makeArrow(L){

}

function updateFlight(rdt){
  const s=G.shot; if(!s||s.done)return;
  let dt=rdt;
  if(save.chase){ // cámara lenta al acercarse a una diana
    for(const T of targets){
      const dz=s.pos.z-T.gz;
      if(dz>0&&dz<9&&Math.abs(s.pos.x-T.g.position.x)<T.r*3&&Math.abs(s.pos.y-T.g.position.y)<T.r*3){dt=rdt*.32;break;}
    }
  }
  const N=4,h=dt/N,wa=windAcc();
  for(let i=0;i<N&&!s.done;i++){
    s.vel.y-=GRAV*h; s.vel.x+=wa*h; s.prev.copy(s.pos); s.pos.addScaledVector(s.vel,h); s.t+=h;
    for(const T of targets){
      if(s.prev.z>T.gz&&s.pos.z<=T.gz){
        const k=(s.prev.z-T.gz)/(s.prev.z-s.pos.z);
        const hx=s.prev.x+(s.pos.x-s.prev.x)*k, hy=s.prev.y+(s.pos.y-s.prev.y)*k;
        const d=Math.hypot(hx-T.g.position.x,hy-T.g.position.y);
        if(d<=T.r){hitTarget(T,hx,hy,d);return;}
        if(Math.abs(hx-T.g.position.x)<=T.r*1.25&&Math.abs(hy-T.g.position.y)<=T.r*1.25){edgeHit(T,hx,hy);return;}
      }
    }
    if(s.pos.y<=0.02){ s.mesh.lookAt(s.pos.clone().add(s.vel)); missShot(s.pos.x,0.05,s.pos.z,'Fallaste'); return; }
    if(s.pos.z<BACK_Z){ s.mesh.lookAt(s.pos.clone().add(s.vel)); missShot(s.pos.x,s.pos.y,BACK_Z,'Demasiado lejos',0xffffff); return; }
    if(Math.abs(s.pos.x)>40){ s.mesh.lookAt(s.pos.clone().add(s.vel)); missShot(s.pos.x,s.pos.y,s.pos.z,'Fallaste'); return; }
  }
  s.mesh.position.copy(s.pos); _ta.copy(s.pos).add(s.vel); s.mesh.lookAt(_ta);
  s.mesh.rotateX(Math.sin(s.t*45)*.05*Math.exp(-s.t*2.2));
  pushTrail(s.pos);
  bow.visible=!save.chase||s.t<.28;
  if(save.chase&&s.t>.12){
    _tb.copy(s.vel).normalize(); _tc.copy(s.pos).addScaledVector(_tb,-3.4); _tc.y+=.55;
    camera.position.lerp(_tc,Math.min(1,rdt*7)); _ta.copy(s.pos).addScaledVector(_tb,8); camera.lookAt(_ta);
  }
  setFov(camera.fov+(baseFov-camera.fov)*Math.min(1,rdt*8));
}
function updateHitcam(dt){
  G.timer-=dt;
  trail.material.opacity=Math.max(0,Math.min(.55,G.timer*.5));
  bow.visible=!save.chase;
  if(save.chase&&G.focus){
    let fp,want;
    if(G.focus.T){fp=G.focus.T.g.position; want=new THREE.Vector3(fp.x+1.6,fp.y+.2,fp.z+Math.min(6,Math.abs(fp.z)*.3));}
    else{fp=G.focus.pos; want=new THREE.Vector3(fp.x+1.5,fp.y+1,fp.z+4);}
    camera.position.lerp(want,Math.min(1,dt*4)); camera.lookAt(fp);
  }
  if(G.timer<=0)endShot();
}
function updateAim(dt){
  const up=save.up;
  camera.position.set(0,CAMY,0);
  if(G.drawing){
    G.power=Math.min(1,G.power+dt/curW().draw);
    if(G.power>=1){G.hold+=dt; if(!G.full){G.full=true;tone(900,.07,'square',.05);buzz(12);}}
  } else {G.power=Math.max(0,G.power-dt*3); G.hold=0; G.full=false;}
  /* mira firme: sin temblor, como mirar por un rifle */
  if(!G.breathing){G.breath=Math.min(3,G.breath+dt*0.5);}
  const sx=0, sy=0;
  camera.rotation.set(G.pitch,G.yaw,0);          // la cámara queda firme
  const fov=baseFov*(1-0.5*G.power); setFov(camera.fov+(fov-camera.fov)*Math.min(1,dt*10));
  G.sx=sx; G.sy=sy; G.vp=G.power;                // el temblor solo mueve la mira
  const vv=(G.power*.85).toFixed(2); if(vv!==_vg){_vg=vv;vig.style.opacity=vv;}
  const pw=Math.round(G.power*100); if(pw!==_pw){_pw=pw;powerFill.style.width=pw+'%';powerFill.classList.toggle('full',pw>=100);}
  const bp=Math.round(G.breath/3*100); if(bp!==_bp){_bp=bp;btnBreath.style.setProperty('--p',bp+'%');}
  const hd=G.breathing&&G.breath>0; if(hd!==_hold){_hold=hd;btnBreath.classList.toggle('hold',hd);}
}
function updateAid(dir){ return; /* mecánica de mira asistida eliminada */
  const el=aidEl, up=save.up;
  if(!dir||save.aidOff||G.state!=='aim'||G.power<0.3||!targets.length){if(aidOn){el.style.display='none';aidOn=false;}return;}
  const dz=-dir.z; if(dz<0.05){if(aidOn){el.style.display='none';aidOn=false;}return;}
  let T=targets[0],best=1e9;
  targets.forEach(t=>{const tt=Math.abs(t.gz)/dz; const lat=Math.abs(dir.x*tt-t.g.position.x); if(lat<best){best=lat;T=t;}});
  const v=shotSpeed(G.power), tt=Math.abs(T.gz)/(v*dz);
  const px=dir.x*v*tt+(up.aid>=2?0.5*windAcc()*tt*tt:0), py=CAMY+dir.y*v*tt-0.5*GRAV*tt*tt;
  mv3.set(px,py,T.gz).project(camera);
  if(mv3.z>1){if(aidOn){el.style.display='none';aidOn=false;}return;}
  const w=app.clientWidth,h=app.clientHeight;
  if(!aidOn){el.style.display='block';aidOn=true;} el.style.transform='translate3d('+((mv3.x*.5+.5)*w).toFixed(1)+'px,'+((-mv3.y*.5+.5)*h).toFixed(1)+'px,0)';
}
const aidEl=$('aid'), crossEl=$('cross'); let aidOn=false, _ct='';
const _sd=new THREE.Vector3(), _sp=new THREE.Vector3(), _eu=new THREE.Euler(0,0,0,'YXZ');
function aimDir(out){_eu.set(G.pitch+G.sy,G.yaw+G.sx,0);return out.set(0,0,-1).applyEuler(_eu);}
function updateSight(){
  if(G.state!=='aim'){ if(_ct!==''){_ct='';crossEl.style.transform='';} updateAid(null); return; }
  aimDir(_sd); _sp.copy(camera.position).addScaledVector(_sd,60).project(camera);
  const w=app.clientWidth,h=app.clientHeight, str='translate3d('+(_sp.x*w/2).toFixed(1)+'px,'+(-_sp.y*h/2).toFixed(1)+'px,0) scale('+(1.3-0.5*G.power).toFixed(2)+')';
  if(str!==_ct){_ct=str;crossEl.style.transform=str;}
  updateAid(_sd);
}
function finishMode(){
  G.state='result'; $('hud').classList.remove('on'); $('aid').style.display='none';
  const sc=G.score, prev=save.best[G.mode]||0, rec=sc>prev; if(rec)save.best[G.mode]=sc;
  if(G.mode==='time')mission('time',sc,true); else mission('surv',G.round,true);
  const coins=Math.floor(sc/2); save.coins+=coins; persist(); refreshLabels();
  $('rTitle').textContent=G.mode==='time'?'¡Se acabó el tiempo!':'Fin de la supervivencia';
  $('rStars').textContent=rec?'🏆':'';
  $('rScore').textContent=sc+' puntos'+(G.mode==='surv'?' · '+G.round+' rondas':'');
  $('rChips').innerHTML='';
  $('rInfo').textContent=(rec?'¡Nuevo récord! ':'Récord: '+prev+'. ')+'Ganaste '+coins+' monedas.';
  $('bNext').style.display='none'; sfx.win(); show('sResult');
}
function finish(){
  $('bLevels').textContent=G.mode==='camp'?'Niveles':'Menú';
  if(G.mode!=='camp'){finishMode();return;}
  G.state='result'; $('hud').classList.remove('on'); $('aid').style.display='none';
  const sc=G.score, stars=sc>=STAR_PTS[2]?3:sc>=STAR_PTS[1]?2:sc>=STAR_PTS[0]?1:0;
  if(stars>(save.stars[level.n]||0))save.stars[level.n]=stars;
  if(stars>0)mission('camp',1);
  const coins=sc+stars*10; save.coins+=coins; persist(); refreshLabels();
  const last=level.n===LEVELS.length;
  $('rTitle').textContent=stars>0?(last?'¡Eres el Maestro del Arco!':'Nivel superado'):'Sigue practicando';
  $('rStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('rScore').textContent=sc+' puntos';
  $('rChips').innerHTML=G.hist.map(h=>`<span class="chip ${h.c}">${h.v||'✕'}</span>`).join('');
  $('rInfo').textContent=stars>0?`Ganaste ${coins} monedas.`:`Necesitas ${STAR_PTS[0]} puntos para pasar. Ganaste ${coins} monedas.`;
  $('bNext').style.display=(stars>0&&!last)?'':'none';
  if(stars>0)sfx.win(); else sfx.lose();
  show('sResult');
}

/* ---------- Entrada ---------- */
cv.addEventListener('pointerdown',e=>{
  if(G.state!=='aim'||G.pid!==null)return;
  e.preventDefault(); ac(); G.pid=e.pointerId; G.drawing=true; G.lx=e.clientX; G.ly=e.clientY;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  sfx.draw(); $('hint').style.display='none';
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==G.pid||G.state!=='aim')return;
  const dx=e.clientX-G.lx, dy=e.clientY-G.ly; G.lx=e.clientX; G.ly=e.clientY;
  const sens=0.0050*(camera.fov/baseFov)*(baseFov/62)*(save.sens||1)*(1-0.4*G.power);
  G.yaw=Math.max(-1.0,Math.min(1.0,G.yaw-dx*sens));
  G.pitch=Math.max(-.35,Math.min(.45,G.pitch-dy*sens));
});
function endPointer(e,fire){
  if(e.pointerId!==G.pid)return;
  G.pid=null;
  if(G.drawing){G.drawing=false; if(fire&&G.power>=0.25&&G.state==='aim')shoot();}
}
cv.addEventListener('pointerup',e=>endPointer(e,true));
cv.addEventListener('pointercancel',e=>endPointer(e,false));
const bb=$('btnBreath');
bb.addEventListener('pointerdown',e=>{e.preventDefault();G.breathing=true;});
['pointerup','pointercancel','pointerleave'].forEach(n=>bb.addEventListener(n,()=>{G.breathing=false;}));
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&G.state==='aim'&&!e.repeat&&G.pid===null){G.drawing=true;G.pid='key';sfx.draw();}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.breathing=true;
  if(G.state==='aim'){const s=0.03; if(e.code==='ArrowLeft')G.yaw+=s; if(e.code==='ArrowRight')G.yaw-=s; if(e.code==='ArrowUp')G.pitch+=s; if(e.code==='ArrowDown')G.pitch-=s;}
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'&&G.pid==='key'){G.pid=null;G.drawing=false;if(G.power>=.25&&G.state==='aim')shoot();}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')G.breathing=false;
});

function click(id,fn){$(id).addEventListener('click',()=>{ac();fn();});}
click('bPlay',()=>{renderLevels();show('sLevels');});
click('bLvBack',()=>show('sMenu'));
click('bShop',()=>{renderShop();show('sShop');});
document.querySelectorAll('#shopTabs button').forEach(b=>b.addEventListener('click',()=>{ac();shopTab=b.dataset.t;renderShop();}));
click('bShopBack',()=>{refreshLabels();show('sMenu');});
const toggleSound=()=>{save.sound=!save.sound;persist();refreshLabels();};
click('bSound',toggleSound); click('bSoundP',toggleSound);
click('bChase',()=>{save.chase=!save.chase;persist();refreshLabels();});
click('btnPause',()=>{ if(G.state==='result'||G.state==='menu'||G.state==='paused')return; G.prevState=G.state; G.state='paused'; G.drawing=false; G.pid=null; G.breathing=false; show('sPause'); });
click('bResume',()=>{hideScreens(); G.state=G.prevState||'aim';});
click('bRetryP',()=>restart());
click('bMenuP',()=>toMenu());
click('bNext',()=>startLevel(Math.min(G.li+1,LEVELS.length-1)));
click('bRetry',()=>restart());
click('bLevels',()=>{if(G.mode!=='camp'){toMenu();return;}renderLevels();show('sLevels');G.state='menu';});
click('bTime',()=>startMode('time')); click('bSurv',()=>startMode('surv'));
click('bStart',()=>{ac();refreshLabels();show('sMenu');});
click('bMis',()=>{renderMissions();show('sMis');}); click('bMisBack',()=>{refreshLabels();show('sMenu');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.state==='aim'||G.state==='flight'||G.state==='hitcam'))$('btnPause').click();});
click('bSens',()=>{const a=[0.6,0.8,1,1.3,1.7],i=a.indexOf(save.sens||1);save.sens=a[(i+1)%a.length];persist();refreshLabels();});
function restart(){if(G.mode==='camp')startLevel(G.li);else startMode(G.mode);}
function toMenu(){
  G.state='menu'; $('hud').classList.remove('on'); $('aid').style.display='none';
  level=LEVELS[0]; buildLevel(level); applyTheme(0); bow.visible=false; camera.position.set(0,CAMY,0);
  refreshLabels(); show('sMenu');
}

/* ---------- Bucle ---------- */
let last=performance.now(), _tl=-1;
function loop(now){
  requestAnimationFrame(loop);
  const raw=now-last, dt=Math.min(0.05,raw/1000); last=now;
  if(G.state!=='paused'&&raw<200){ // baja la resolución si el móvil no llega a ~48 fps
    if(warm>0)warm--;
    else{frameN++; if(raw>21)slowN++; if(frameN>=60){if(slowN>=30&&pr>.7){pr=Math.max(.7,pr-.15);resize();} frameN=0;slowN=0;}}
  }
  if(G.state!=='paused')G.time+=dt;
  if(G.mode==='time'&&(G.state==='aim'||G.state==='flight')){
    G.timeLeft=Math.max(0,G.timeLeft-dt); const sl=Math.ceil(G.timeLeft);
    if(sl!==_tl){_tl=sl;$('hArrows').textContent='⏱ '+sl;}
    if(G.timeLeft<=0&&G.state==='aim')finish();
  }
  if(G.state!=='paused'){
    const t=G.time;
    targets.forEach(T=>{
      if(level&&level.move>0&&G.state!=='menu')T.g.position.x=T.baseX+Math.sin(t*T.mv+T.phase)*T.range;
      if(T.shake>0){T.shake=Math.max(0,T.shake-dt*1.8);T.g.rotation.x=Math.sin(t*38)*T.shake*0.16;}
    });
    clouds.forEach(c=>{c.position.x+=dt*1.2; if(c.position.x>180)c.position.x=-180;});
    const k=flag.userData.k||0, mx=4.2, s=0.35+0.65*Math.min(1,Math.abs(k)/mx);
    cloth.scale.x=(k>=0?1:-1)*s; cloth.rotation.z=Math.sin(t*6)*0.08*s; cloth.rotation.y=Math.sin(t*4)*0.25*s;
    if(G.state==='menu'){
      G.menuT+=dt; camera.rotation.set(0.03+Math.sin(G.menuT*.3)*.02,Math.sin(G.menuT*.25)*.35,0);
    } else if(G.state==='aim')updateAim(dt);
    else if(G.state==='flight')updateFlight(dt);
    else if(G.state==='hitcam')updateHitcam(dt);
    if(bow.visible)updateBowVisual(dt);
    updateEffects(dt,t);
  }
  if((G.state==='menu'||G.state==='paused'||G.state==='result')&&((skipF^=1)===1))return;
  renderer.render(scene,camera);
  updateSight();
}

/* ---------- Inicio ---------- */
applyEquip(); resize(); refreshLabels();
level=LEVELS[0]; buildLevel(level); bow.visible=false;
requestAnimationFrame(loop);
})();
</script>
