  for(let j=0;j<2;j++){cx.fillStyle=G.w[k]>j?'#e8b84a':'#0008';cx.beginPath();cx.arc(k?x+500-j*26:x+14+j*26,88,9,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke()}
  const L=['a','s','x','z','v'].map(n=>kn(MAP[f.p][n])),cds=f.ch=='sam'?[['Roll '+L[1],f.cd.r,.8],['Fuerte '+L[2],f.cd.x,3],['Combo '+L[3],f.cd.z,25],['Sombrero '+L[4],f.cd.v,7]]:[['Viento '+L[1],f.cd.s,2.2],['Tormenta '+L[2],f.cd.t,6],['Explosión ↓+'+L[0],f.cd.u,12],['Raíces '+L[3],f.cd.z,9]];
  cds.forEach((c,j)=>{const px=k?x+520-(j+1)*130+10:x+j*130,r=1-c[1]/c[2];cx.fillStyle='#0008';cx.fillRect(px,104,120,10);cx.fillStyle=r>=1?'#7dd87d':'#999';cx.fillRect(px,104,120*r,10);lbl(c[0],px,126)})});
 if(G.ph=='intro')txt(G.pt<1?'RONDA '+G.rd:'¡PELEA!',W/2,300,90,'#ffd36a');
 if(G.ph=='ko')txt(G.win<0?'EMPATE':'¡K.O.!',W/2,300,100,'#ff6a4a');
 if(G.ph=='over'){cx.fillStyle='#000b';cx.fillRect(0,0,W,H);const w=G.fs[G.w[0]>=2?0:1];txt('GANA '+(G.mode==2?'P'+(w.p+1)+' · ':'')+(w.ch=='sam'?'EL RÁPIDO':'EL MAESTRO'),W/2,320,72,'#ffd36a');txt('Enter: revancha · Esc: menú',W/2,400,34)}}
function pauseUI(){if(G.pause){cx.fillStyle='#000a';cx.fillRect(0,0,W,H);txt('PAUSA',W/2,330,90,'#ffd36a');txt('P: continuar · Esc: menú',W/2,400,32)}}
function menu(){
 cx.fillStyle='#000c';cx.fillRect(0,0,W,H);
 txt('DUELO DE SAMURÁIS',W/2,210,92,'#ffd36a');
 for(const m of MR)txt(m.t(),W/2,m.y,m.s,m.s>30?'#fff':'#cfc6b8');
 txt('Mejor de 3 rondas · P = pausa',W/2,600,26,'#8a8277')}

onkeydown=e=>{
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
 KS[e.code]=1;
 if(e.code=='Tab')e.preventDefault();
 if(G.m=='ctl'){ctlKey(e);return}
 if(G.m=='menu'){if(e.code=='KeyK')openCtl();if(e.code=='Digit1'||e.code=='Numpad1')startMatch(1);if(e.code=='Digit2'||e.code=='Numpad2')startMatch(2);if(e.code=='KeyC')G.swap^=1;if(e.code=='KeyV')G.dif=(G.dif+1)%3}
 else{if(e.code=='KeyP'&&G.ph!='over')G.pause=!G.pause;if(e.code=='Escape'){G.m='menu';G.pause=false}if(e.code=='Enter'&&G.ph=='over')startMatch(G.mode)}};
onkeyup=e=>{KS[e.code]=0};
onblur=()=>{for(const k in KS)KS[k]=0;if(G.m=='fight'&&G.ph!='over')G.pause=true};

const LV=Array.from({length:18},()=>({x:Math.random()*W,y:Math.random()*H,v:35+Math.random()*45,ph:Math.random()*6,k:Math.random()<.8?'sak':'lot',r:Math.random()*4}));
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 if(G.m=='menu'){for(const m of MR)if(y>=m.y-m.s*.8&&y<=m.y+10){m.f();break}}else if(G.m=='ctl')ctlClick(x,y)};
loadCtl();updLegend();
let last=0,acc=0;const ks=Object.keys(DATA.img);
function prep(){
 BG=document.createElement('canvas');BG.width=W+80;BG.height=H+40;
 const g=BG.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;
 const gr=g.createLinearGradient(0,20,0,H+20);gr.addColorStop(0,'#f6a35c');gr.addColorStop(.55,'#ffe3b0');gr.addColorStop(1,'#fff2d8');
 g.fillStyle=gr;g.fillRect(0,0,W+80,H+40);g.drawImage(IM.bg,20,20,W+40,H);
 for(const k of ks){if(!/^[sb]_/.test(k))continue;const im=IM[k],c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
  const q=c.getContext('2d'),nf=!('filter' in q);if(!nf)q.filter='brightness(3) saturate(.3)';q.drawImage(im,0,0);
  if(nf){q.globalCompositeOperation='source-atop';q.fillStyle='rgba(255,255,255,.7)';q.fillRect(0,0,c.width,c.height)}FL[k]=c}
 for(const t of ['RONDA 1','¡PELEA!','¡K.O.!'])txt(t,0,0,90,'#ffd36a')}
Promise.all(ks.map(k=>{const i=new Image();i.src=DATA.img[k];IM[k]=i;return i.decode().catch(()=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))})).then(()=>{prep();requestAnimationFrame(loop)});
function loop(ts){acc+=Math.min(.1,(ts-last)/1000);last=ts;while(acc>=1/60){tick(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
</script>
